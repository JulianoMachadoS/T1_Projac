# projarq/
# ├── docker-compose.yml   (este arquivo: banco próprio + serviço de integração)
# ├── i-educar/            (incluido abaixo via include)
# ├── Moodle/              (incluido abaixo via include)
# └── integration/         (NestJS)

include:
  - i-educar/docker-compose.yml
  - Moodle/docker-compose.yml

services:
  integration-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${INTEGRATION_DB_USER:-integration}
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:-integration}
      POSTGRES_DB: ${INTEGRATION_DB_NAME:-integration}
    ports:
      - "5433:5432" # 5432 já é usada pelo postgres do i-Educar
    volumes:
      - integration_db:/var/lib/postgresql/data

  integration:
    build: ./integration
    env_file: .env
    environment:
      INTEGRATION_DB_HOST: integration-db
      INTEGRATION_DB_PORT: 5432
    # modo dev: usa o codigo da pasta integration/ e reinicia sozinho quando um arquivo muda
    command: npm run start:dev
    volumes:
      - ./integration:/app
      - /app/node_modules # node_modules fica o da imagem, nao o do mac
    ports:
      - "3000:3000"
    depends_on:
      - integration-db

volumes:
  integration_db:
